name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 서버 API 테스트
        working-directory: server
        run: |
          pip install -q -r requirements.txt
          python test_api.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 고정 서명 키 준비 (Secrets에 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/eodi-release.jks
            echo "고정 키로 서명합니다."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 비밀값이 없어 임시 디버그 키로 서명합니다 (업데이트 시 재설치 필요)."
          fi
      - name: Firebase 설정 (Secrets에 있을 때만 → 푸시 켜짐)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json 적용 → 푸시(FCM) 포함 빌드"
          else
            echo "::warning::GOOGLE_SERVICES_JSON 비밀값이 없어 푸시 없이 빌드합니다."
          fi
      - name: Build APK
        working-directory: android
        env:
          EODI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../eodi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eodi-apk
          path: eodi.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (서명 없이)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project Eodi.xcodeproj -scheme Eodi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: 서명 안 된 IPA 만들기 (Sideloadly/AltStore가 설치하면서 서명)
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Eodi.app Payload/
          zip -qry ../Eodi.ipa Payload
          ls -la ../Eodi.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: eodi-ipa
          path: Eodi.ipa

  # main에 푸시할 때마다 'latest' 릴리스의 파일을 최신으로 교체 → 고정 링크로 바로 내려받기
  # 한쪽(예: 맥 러너 부족으로 iOS)이 실패해도 성공한 파일은 올리고, 나머지는 이전 파일 유지
  release:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.ios.result == 'success')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: latest 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          ls -la
          files=()
          [ "$ANDROID" = success ] && [ -f eodi.apk ] && files+=(eodi.apk)
          [ "$IOS" = success ] && [ -f Eodi.ipa ] && files+=(Eodi.ipa)
          notes="main의 최신 커밋으로 자동 빌드된 파일입니다.
          - eodi.apk: 갤럭시에서 바로 설치 (android: $ANDROID, ${GITHUB_SHA::7})
          - Eodi.ipa: 서명 안 된 아이폰 앱 → Sideloadly/AltStore로 설치 (ios: $IOS)
          실패한 쪽은 이전 빌드 파일이 그대로 남아 있어요."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --prerelease --title "최신 빌드" --notes "$notes"
          fi
          gh release upload latest "${files[@]}" --clobber
          gh release edit latest --title "최신 빌드 (${GITHUB_SHA::7})" --notes "$notes"
