services:
  eodi:
    build: .
    container_name: eodi
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:45900:8000"   # Cloudflare Tunnel이 여기로 연결
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
